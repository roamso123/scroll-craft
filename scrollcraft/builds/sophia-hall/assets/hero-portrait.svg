<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 1040" width="528" height="1040" role="img" aria-label="Sophia Hall standing in training gear, shoulders back, arms relaxed, mid-breath">
  <title>Sophia Hall in training gear</title>
  <defs>
    <linearGradient id="figure" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#1C5849"/>
      <stop offset="0.5" stop-color="#123C33"/>
      <stop offset="1" stop-color="#0A2620"/>
    </linearGradient>
    <linearGradient id="rimline" x1="1" y1="0" x2="0.35" y2="0.8">
      <stop offset="0" stop-color="#F4573C"/>
      <stop offset="0.75" stop-color="#F4573C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="keylight" x1="1" y1="0" x2="0.1" y2="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ponytail, behind the figure, swung to her left -->
  <path d="M300 62c32 10 44 42 38 76-5 28-20 44-22 68-2 18 6 30 0 39-7 10-23 6-26-5-4-14 7-25 7-43 0-22-10-36-13-56-4-23 4-73 16-79z" fill="#0E332B"/>

  <!-- The figure is one half-silhouette, mirrored: a symmetric outline cannot
       drift out of proportion on one side, and the asymmetry that gives it life
       is added afterwards in the ponytail, the rim light and the hem curves. -->
  <g fill="url(#figure)">
    <path id="half" d="M264 28
      C294 28 308 58 308 98
      C308 124 298 146 284 154
      C284 164 284 170 284 180
      C318 188 346 204 364 228
      C382 252 394 286 400 324
      C406 364 408 404 406 450
      C405 484 400 510 394 524
      C390 534 378 535 374 526
      C368 512 366 488 366 454
      C366 412 362 374 354 342
      C349 320 342 302 334 290
      C336 308 336 324 334 342
      C330 368 316 388 310 406
      C306 422 308 442 314 460
      C324 488 332 514 336 546
      C340 598 338 654 334 708
      C330 770 324 838 320 904
      C318 942 316 974 314 994
      C313 1010 300 1016 290 1012
      C280 1008 276 998 276 986
      C276 942 274 886 272 830
      C270 774 268 728 264 694 Z"/>
    <use href="#half" transform="translate(528,0) scale(-1,1)"/>
  </g>

  <!-- key light down the lit side, inside the silhouette -->
  <g fill="url(#keylight)">
    <path d="M264 28c30 0 44 30 44 70 0 26-10 48-24 56v10c34 8 62 24 80 48 18 24 30 58 36 96 6 40 8 80 6 126-1 34-6 60-12 74l-26-8c6-14 11-40 12-74 2-46 0-86-6-126-6-38-18-72-36-96-18-24-46-40-80-48v-10c14-8 24-30 24-56 0-40-8-70-38-70z"/>
  </g>

  <!-- the rim: the only warm thing on the figure -->
  <path fill="none" stroke="url(#rimline)" stroke-width="7" stroke-linecap="round"
        d="M284 154C318 188 346 204 364 228 382 252 394 286 400 324 406 364 408 404 406 450 405 484 400 510 394 524"/>
  <path fill="none" stroke="url(#rimline)" stroke-width="6" stroke-linecap="round" opacity="0.75"
        d="M336 546C340 598 338 654 334 708 330 770 324 838 320 904"/>

  <!-- crop-top hem and waistband: curves, never lines -->
  <path fill="#0A2620" opacity="0.55" d="M206 352c18 9 36 13 58 13s40-4 58-13c1 8 1 15 0 22-18 10-36 14-58 14s-40-4-58-14c-1-7-1-14 0-22z"/>
  <path fill="#F4573C" opacity="0.5" d="M212 424c16 9 33 13 52 13s36-4 52-13c1 6 1 12 0 18-16 9-33 13-52 13s-36-4-52-13c-1-6-1-12 0-18z"/>

  <!-- hair first, then the headband over it: coral, the one mark that says athlete -->
  <path fill="#0E332B" d="M220 96c-2-34 18-56 44-56s44 20 44 52c-10-14-25-22-44-22-18 0-32 7-40 20-2 4-3 7-4 11-1-2 0-4 0-5z"/>
  <path fill="#F4573C" d="M222 80c9-22 23-33 42-33s33 11 42 33c-13-10-26-15-42-15s-29 5-42 15z"/>
</svg>
