<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Sophia Hall, head and shoulders">
  <title>Sophia Hall</title>
  <defs>
    <radialGradient id="hbg" cx="0.34" cy="0.26" r="0.95">
      <stop offset="0" stop-color="#FFF1EB"/>
      <stop offset="1" stop-color="#E7F0EB"/>
    </radialGradient>
    <linearGradient id="hfig" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#1C5849"/>
      <stop offset="0.55" stop-color="#123C33"/>
      <stop offset="1" stop-color="#0A2620"/>
    </linearGradient>
    <linearGradient id="hrim" x1="1" y1="0.1" x2="0.3" y2="0.9">
      <stop offset="0" stop-color="#F4573C"/>
      <stop offset="0.8" stop-color="#F4573C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#hbg)"/>

  <!-- ponytail behind -->
  <path d="M188 64c30 10 40 42 33 74-5 24-18 38-20 58l-26 4c-3-24-14-40-17-60-4-24 6-72 30-76z" fill="#0E332B"/>

