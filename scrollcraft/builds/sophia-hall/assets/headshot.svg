  <!-- key light and the coral rim down her lit side -->
  <path fill="#FFFFFF" opacity="0.10" d="M150 34c30 0 48 24 48 58 0 20-7 38-19 47v12c30 8 54 22 70 40 13 15 22 34 26 55v54h-26v-54c-4-21-13-40-26-55-16-18-40-32-70-40v-12c12-9 19-27 19-47 0-34-10-58-22-58z"/>
  <path fill="none" stroke="url(#hrim)" stroke-width="6" stroke-linecap="round"
        d="M179 139c30 8 54 22 70 40 13 15 22 34 26 55"/>

  <!-- hair, then the coral band over it -->
  <path fill="#0E332B" d="M104 92c-2-30 18-50 46-50s46 18 46 46c-11-13-26-20-46-20-19 0-33 6-42 18-2 3-3 6-4 10 0-2 0-3 0-4z"/>
  <path fill="#F4573C" d="M107 76c9-20 24-30 43-30s34 10 43 30c-13-9-27-13-43-13s-30 4-43 13z"/>
