# personaswap configuration.
#
# Copy to personaswap.toml and edit. The API key is NOT kept here — it is read
# from the KIE_AI_API_KEY environment variable or a .env beside this file.

[paths]
source = "media/source"
output = "media/output"
state  = ".personaswap/state.db"

[run]
concurrency    = 2      # parallel clips; raise once you know your rate limit
poll_timeout_s = 1800   # per clip, 30 min
max_retries    = 3

# ---------------------------------------------------------------- the model --
# Defaults to Kling 3.0 motion-control, applied even if `model` is absent or
# blank. Note what this model does: it regenerates the scene with your persona
# performing the motion from your clip. It is motion transfer, not a frame-by-
# frame face replacement on the original footage.
[swap]
model = "kling-3.0/motion-control"

# Kling wants the identity still and the driving clip as single-element arrays,
# so these two logical inputs get wrapped in a list before sending.
array_fields = ["video", "face"]

# Our three logical inputs mapped onto the model's own field names.
[swap.fields]
video  = "video_urls"   # the driving clip: supplies the motion
face   = "input_urls"   # the persona reference still: supplies the identity
prompt = "prompt"

# Passed through verbatim. Nothing is injected automatically, because an
# unrecognised field is a 400 on some models.
[swap.extra]
mode                  = "720p"        # or "1080p"
character_orientation = "image"       # "image" | "video"
background_source     = "input_video" # keeps the original scene; DROP this key
                                      # if you want the prompt to change the
                                      # background, or it will be ignored
# negative_prompt = "identity drift, face morphing, warping, flicker"
                                      # support on this model is unconfirmed;
                                      # see prompts.DEFAULT_NEGATIVE

[style]
# `lead` opens every prompt. The default states the motion-transfer
# relationship; override it if you move to a face-replacement model.
# lead = "The character in the reference image performs the motion from the reference video"
#
# `base` closes every prompt. Use it for the house look of the whole roster.
base = "natural colour grade, sharp focus on the subject"

[provenance]
tag_metadata = true   # write a synthetic-content tag into the output container
sidecar      = true   # write <output>.mp4.json with the full recipe

# ------------------------------------------------------------------ personas --
# The synthetic identities you are swapping TO. `face` is your generated
# reference still. Keep `synthetic = true` honest: if a face is based on a real
# person, it needs that person's release, and this pipeline is not the place
# for it.
[personas.aurora]
face      = "personas/aurora/face.png"
look      = "warm olive skin, dark wavy hair, mid-20s, soft jawline"
synthetic = true

# ------------------------------------------------------------------ releases --
# The paperwork behind each source clip. `covers_synthetic_alteration` is the
# gate: the pipeline refuses to process a clip unless its release explicitly
# grants the right to alter the performer's likeness synthetically. A standard
# capture-and-distribute release usually does NOT. Check the signed document
# before you set this to true.
[releases.ROSTER-2026-01]
talent                      = "Talent Name"
signed                      = "2026-01-04"
expires                     = "2027-01-04"
covers_synthetic_alteration = false
notes                       = "set true only after legal confirms the clause"
